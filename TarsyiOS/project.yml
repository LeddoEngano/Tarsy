name: TarsyiOS
options:
  bundleIdPrefix: com.tarsy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
packages:
  TarsyShared:
    path: ../TarsyShared
targets:
  TarsyiOS:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Tarsy
        CFBundleName: Tarsy
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationQueriesSchemes:
          - tailscale
        NSLocalNetworkUsageDescription: "Tarsy connects to your Mac on the local network to stream and send commands."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarsy.ios
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: TarsyShared
