name: TarsyiOS
options:
  bundleIdPrefix: com.tarsy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  TarsyShared:
    path: ../TarsyShared
targets:
  TarsyiOS:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Tarsy
        CFBundleName: Tarsy
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationQueriesSchemes:
          - tailscale
        NSLocalNetworkUsageDescription: "Tarsy connects to your Mac on the local network to stream and send commands."
        NSPhotoLibraryUsageDescription: "Tarsy needs access to your photos to send images to the AI agent."
        NSPhotoLibraryAddUsageDescription: "Tarsy saves screenshots from the stream to your photo library."
        NSCameraUsageDescription: "Tarsy can use the camera to capture and send images to the AI agent."
        NSMicrophoneUsageDescription: "Tarsy uses the microphone for voice-to-text input to send commands to the AI agent."
        NSSpeechRecognitionUsageDescription: "Tarsy uses speech recognition to convert your voice into text commands."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.tarsy.ios
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: TarsyiOS.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarsy.ios
        DEVELOPMENT_TEAM: "J2M334NJ3L"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "Automatic"
    dependencies:
      - package: TarsyShared
schemes:
  TarsyiOS:
    build:
      targets:
        TarsyiOS: all
