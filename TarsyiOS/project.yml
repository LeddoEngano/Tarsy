name: TarsyiOS
options:
  bundleIdPrefix: com.tarsy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
configFiles:
  Debug: ../Tarsy.xcconfig
  Release: ../Tarsy.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  TarsyShared:
    path: ../TarsyShared
targets:
  TarsyiOS:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Tarsy
        CFBundleName: Tarsy
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "2"
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "Tarsy connects to your Mac on the local network to stream and send commands."
        NSPhotoLibraryUsageDescription: "Tarsy needs access to your photos to send images to the AI agent."
        NSPhotoLibraryAddUsageDescription: "Tarsy saves screenshots from the stream to your photo library."
        NSCameraUsageDescription: "Tarsy can use the camera to capture and send images to the AI agent."
        NSMicrophoneUsageDescription: "Tarsy uses the microphone for voice-to-text input to send commands to the AI agent."
        NSSpeechRecognitionUsageDescription: "Tarsy uses speech recognition to convert your voice into text commands."
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.tarsy.ios
              - tarsy
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIAppFonts:
          - InterVariable.ttf
          - InterVariable-Italic.ttf
        ITSAppUsesNonExemptEncryption: false
        TARSY_SUPABASE_URL: $(TARSY_SUPABASE_URL)
        TARSY_SUPABASE_ANON_KEY: $(TARSY_SUPABASE_ANON_KEY)
        TARSY_RELAY_URL: $(TARSY_RELAY_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: TarsyiOS.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.tarsy.ios
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.tarsy.ios
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "Automatic"
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: "YES"
    dependencies:
      - package: TarsyShared
      - target: TarsyWidgetExtension
        embed: true
  TarsyWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: TarsyWidgetExtension
        excludes:
          - Info.plist
      - path: Sources/LiveActivity/TarsyActivityAttributes.swift
        buildPhase: sources
      - path: Sources/Fonts
        buildPhase: resources
    entitlements:
      path: TarsyWidgetExtension/TarsyWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tarsy.ios
    info:
      path: TarsyWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: Tarsy Widgets
        CFBundleName: TarsyWidgets
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "2"
        UIAppFonts:
          - InterVariable.ttf
          - InterVariable-Italic.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarsy.ios.widgets
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "Automatic"
        SWIFT_VERSION: "5.9"
schemes:
  TarsyiOS:
    build:
      targets:
        TarsyiOS: all
        TarsyWidgetExtension: [build, archive]
    run:
      executable: TarsyiOS
