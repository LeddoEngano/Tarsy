name: TarsyiOS
options:
  bundleIdPrefix: com.tarsy
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
packages:
  TarsyShared:
    path: ../TarsyShared
targets:
  TarsyiOS:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarsy.ios
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_VALUES: >-
          CFBundleDisplayName=Tarsy
          CFBundleName=Tarsy
          CFBundleShortVersionString=0.1.0
          CFBundleVersion=1
          UILaunchScreen_Generation=YES
          UIRequiredDeviceCapabilities=[armv7]
          UISupportedInterfaceOrientations=[UIInterfaceOrientationPortrait]
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: TarsyShared
