name: TarsymacOS
options:
  bundleIdPrefix: com.tarsy
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
configFiles:
  Debug: ../Tarsy.xcconfig
  Release: ../Tarsy.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  TarsyShared:
    path: ../TarsyShared
targets:
  TarsymacOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "HotReload/Dylib/**"
    postCompileScripts:
      - script: |
          # Compile TarsyHotReload.dylib for iOS Simulator (arm64)
          SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          DYLIB_OUT="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Resources/TarsyHotReload.dylib"
          DYLIB_TMP="$TEMP_DIR/TarsyHotReload.dylib"
          mkdir -p "$(dirname "$DYLIB_OUT")"
          mkdir -p "$(dirname "$DYLIB_TMP")"
          xcrun clang -arch arm64 \
            -target arm64-apple-ios17.0-simulator \
            -isysroot "$SDK_PATH" \
            -dynamiclib \
            -framework Foundation \
            -o "$DYLIB_TMP" \
            "$SRCROOT/Sources/HotReload/Dylib/TarsyHotReload.c" \
            "$SRCROOT/Sources/HotReload/Dylib/fishhook.c" \
          && cp "$DYLIB_TMP" "$DYLIB_OUT" \
          && echo "Built TarsyHotReload.dylib" \
          || echo "warning: Failed to build TarsyHotReload.dylib"
        name: "Compile HotReload Dylib"
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Sources/HotReload/Dylib/TarsyHotReload.c
          - $(SRCROOT)/Sources/HotReload/Dylib/fishhook.c
          - $(SRCROOT)/Sources/HotReload/Dylib/fishhook.h
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/$(CONTENTS_FOLDER_PATH)/Resources/TarsyHotReload.dylib
    info:
      path: Info.plist
      properties:
        CFBundleIconName: AppIcon
        CFBundleDisplayName: Tarsy
        CFBundleName: Tarsy
        CFBundleShortVersionString: "1.1.1"
        CFBundleVersion: "22"
        LSUIElement: true
        LSApplicationCategoryType: "public.app-category.developer-tools"
        NSAppleEventsUsageDescription: "Tarsy needs to control your browser to manage tabs and navigate pages."
        NSDesktopFolderUsageDescription: "Tarsy runs AI coding agents that need to read and write project files on your Desktop. Without this, agents will fail the moment they touch a file here and you will not be able to approve it while you are away from your Mac."
        NSDocumentsFolderUsageDescription: "Tarsy runs AI coding agents that need to read and write project files in Documents. Without this, agents will fail the moment they touch a file here and you will not be able to approve it while you are away from your Mac."
        NSDownloadsFolderUsageDescription: "Tarsy runs AI coding agents that need to read files in Downloads (package caches, installers, cloned repos). Without this, agents will fail the moment they touch a file here and you will not be able to approve it while you are away from your Mac."
        NSRemovableVolumesUsageDescription: "Tarsy may need to access projects stored on external drives. Without this, agents will fail on removable-volume projects and you will not be able to approve it remotely."
        NSNetworkVolumesUsageDescription: "Tarsy may need to access projects stored on network shares. Without this, agents will fail on network-volume projects and you will not be able to approve it remotely."
        ITSAppUsesNonExemptEncryption: false
        TARSY_SUPABASE_URL: $(TARSY_SUPABASE_URL)
        TARSY_SUPABASE_ANON_KEY: $(TARSY_SUPABASE_ANON_KEY)
        TARSY_RELAY_URL: $(TARSY_RELAY_URL)
        ATSApplicationFontsPath: Fonts
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.tarsy.macos
    entitlements:
      path: TarsymacOS.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.automation.apple-events: true
        com.apple.developer.applesignin:
          - Default
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.tarsy.macos"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarsy.macos
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: "Automatic"
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: TarsyShared
