name: TarsymacOS
options:
  bundleIdPrefix: com.tarsy
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
packages:
  TarsyShared:
    path: ../TarsyShared
targets:
  TarsymacOS:
    type: application
    platform: macOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarsy.macos
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_VALUES: >-
          CFBundleDisplayName=Tarsy
          CFBundleName=Tarsy
          CFBundleShortVersionString=0.1.0
          CFBundleVersion=1
          LSUIElement=YES
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: TarsyShared
